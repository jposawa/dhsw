[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Config do Firebase Web e publica por design (vai no bundle do cliente).
  # A protecao real esta nas Security Rules, nao em esconder essas chaves.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_DATABASE_URL,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID"

# SPA — BrowserRouter precisa que todo caminho seja servido pelo index.html.
# Sem isto, recarregar em /fichas da 404. E a unica coisa que o hash router
# resolvia, e e uma linha de configuracao. Ver src/main.tsx.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
