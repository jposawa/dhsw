[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA — BrowserRouter precisa que todo caminho seja servido pelo index.html.
# Sem isto, recarregar em /fichas da 404. E a unica coisa que o hash router
# resolvia, e e uma linha de configuracao. Ver src/main.tsx.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
